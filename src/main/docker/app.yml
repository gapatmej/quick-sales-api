version: '2'
services:
  quicksalesapi-app:
    image: quicksalesapi
    environment:
      - _JAVA_OPTIONS=-Xmx512m -Xms256m
      - SPRING_PROFILES_ACTIVE=prod,swagger
      - MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED=true
      - SPRING_DATASOURCE_URL=jdbc:postgresql://quicksalesapi-postgresql:5432/QuickSalesAPI
      - JHIPSTER_SLEEP=30 # gives time for other services to boot before the application
    ports:
      - 8080:8080
  quicksalesapi-postgresql:
    extends:
      file: postgresql.yml
      service: quicksalesapi-postgresql
